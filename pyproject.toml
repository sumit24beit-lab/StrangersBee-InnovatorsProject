[project]
name = "kitchenstation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asgiref==3.12.1",
    "dj-database-url==3.1.2",
    "Django==5.2.18",
    "Pillow==12.3.0",
    "psycopg2==2.9.13",
    "python-dotenv==1.2.4",
    "sqlparse==0.6.0",
    "tzdata==2026.5",
    "whitenoise==6.12.0",
]

[tool.vercel.scripts]
build = 'DATABASE_URL="$DATABASE_URL_UNPOOLED" python manage.py migrate --noinput'
